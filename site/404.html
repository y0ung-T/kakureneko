    .pose--dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .pose--light { display: none; }
      .pose--dark { display: block; }
    }
    h1 { font-size: 32px; line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 12px; text-wrap: balance; }
    p { margin: 0 0 24px; color: var(--ink-2); }
    .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; list-style: none; padding: 0; margin: 0; }
    a { color: inherit; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 24px;
      border-radius: 999px; font-weight: 600; text-decoration: none; border: 1px solid transparent;
    }
    .btn-primary { background: var(--amber); color: #121212; }
    .btn-secondary { background: var(--card); color: var(--ink); border-color: var(--line); }
    .more { margin: 24px 0 0; font-size: 15px; }
    :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
    @media (min-width: 640px) { h1 { font-size: 44px; } main { padding: 64px 24px; } }
  </style>
