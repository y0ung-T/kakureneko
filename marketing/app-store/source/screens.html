<!doctype html>
<!-- App Store screenshots for Kakureneko for iPhone (docs/APP-STORE.md §7, "design language/DESIGN.md").
     One template, six shots: screens.html?n=1 … ?n=6, rendered at 1320 × 2868 by marketing/app-store/render.sh.
     Paper background, ink caption on top, the real Simulator screenshot (marketing/screenshots/iphone) in a flat ink
     frame. No gradients, no soft shadows: depth comes from overlap. Captions are plain sentences, no exclamation marks. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kakureneko App Store screenshots</title>
<style>
  :root {
    --ink: #121212; --paper: #F4F2EC; --card: #FFFFFF; --line: #E2DFD6; --ink-2: #6E6B63; --ink-3: #9A978F;
    --amber: #FFB300; --pink: #FF4D8D;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    --text: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1320px; height: 2868px; overflow: hidden; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; position: relative; }

  /* The caption block sits centred in the space above the phone, so the phone is at the same height in every shot */
  .head {
    position: absolute; left: 0; right: 0; top: 80px; height: 800px; padding: 0 56px; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 18px;
    font: 600 38px/1 var(--text); letter-spacing: 0.04em; text-transform: uppercase;
    padding: 18px 32px; border-radius: 999px; margin-bottom: 44px;
  }
  .pill i { width: 22px; height: 22px; border-radius: 50%; display: block; }
  h1 { font-size: 104px; line-height: 1.04; font-weight: 700; letter-spacing: -0.025em; text-wrap: balance; }
  .sub { margin: 36px auto 0; max-width: 1000px; font: 400 46px/1.32 var(--text); color: var(--ink-2); text-wrap: balance; }

  /* Phone: the screenshot inside a flat ink bezel, bleeding off the bottom edge */
  .phone {
    position: absolute; left: 50%; top: 880px; transform: translateX(-50%);
    width: 1062px; padding: 26px; border-radius: 152px; background: var(--ink);
  }
  .phone img { display: block; width: 1010px; height: auto; border-radius: 126px; }

  /* An iPhone notification with the alert the Mac sends (texts from AlertPresentation / Demo.swift) */
  .note-stack { position: absolute; left: 50%; transform: translateX(-50%); width: 1210px; top: 1010px; }
  .note {
    display: grid; grid-template-columns: 112px 1fr 168px; gap: 28px; align-items: center;
    background: var(--card); border: 4px solid var(--ink); border-radius: 64px; padding: 34px 38px;
  }
  .note .icon { width: 112px; height: 112px; border-radius: 26px; display: block; }
  .note .row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .note b { font: 650 44px/1.2 var(--text); }
  .note .now { font: 400 36px/1 var(--text); color: var(--ink-3); }
  .note .subtitle { font: 600 40px/1.25 var(--text); }
  .note .body { font: 400 38px/1.25 var(--text); white-space: nowrap; }
  .note .thumb { width: 168px; height: 168px; border-radius: 22px; display: block; }
  .menu {
    width: 640px; margin: 22px 0 0 auto; background: var(--card); border: 4px solid var(--ink); border-radius: 48px;
    font: 400 44px/1 var(--text); overflow: hidden;
  }
  .menu div { display: flex; justify-content: space-between; align-items: center; padding: 38px 44px; }
  .menu div + div { border-top: 2px solid var(--line); }
  .menu .destructive { color: #B3261E; }
  .menu svg { width: 52px; height: 52px; }

  /* Soot peeking over the bottom edge (DESIGN.md §5: never cropped by the frame, only by the canvas) */
  .soot { position: absolute; left: 50%; transform: translateX(-50%); bottom: -20px; width: 760px; }
</style>
</head>
<body>
<div class="head">
  <span class="pill" id="pill"><i></i><span></span></span>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
</div>
<div class="phone"><img id="shot" alt=""></div>
<div id="extra"></div>

<script>
  // State colours from DESIGN.md §2.1: [fill, text on paper]
  const states = {
    working: ['#FFB300', '#7A5200'], waiting: ['#FF4D8D', '#B3134F'], drowsy: ['#7B6CF6', '#4A3FD0'],
    finished: ['#34B36B', '#1B7A43'], idle: ['#8E8B84', '#6E6B63']
  };
  const shots = {
    1: { state: 'working', label: 'Lid closed, still working', file: '01-working.png',
         title: 'Close the lid.<br>Your agents keep working.',
         sub: 'Kakureneko keeps your Mac awake while they work, and your iPhone in the loop.' },
    2: { state: 'waiting', label: 'Waiting for you', file: '03-waiting.png', note: true,
         title: 'Know when an agent needs you.',
         sub: 'Alerts that need you are Time Sensitive, so they get through Focus.' },
    3: { state: 'drowsy', label: 'Sleeping soon', file: '02-countdown.png',
         title: 'Keep it awake,<br>or let it sleep.',
         sub: 'A countdown before your Mac sleeps, with the buttons right there.' },
    4: { state: 'finished', label: 'Activity', file: '04-activity.png',
         title: 'The last three days, in one list.',
         sub: 'Finished, waiting, asleep: every alert from your Macs, grouped by day.' },
    5: { state: 'idle', label: 'Several Macs', file: '06-several-macs.png',
         title: 'Same Apple Account.<br>No pairing.',
         sub: 'Every Mac signed in to your iCloud shows up here on its own.', soot: 'hide.svg' },
    6: { state: 'working', label: 'No account, no tracking', file: '05-welcome.png',
         title: 'Nothing to sign up for.',
         sub: 'Your Mac and iPhone talk through Apple’s iCloud. Alerts are deleted after three days.' }
  };

  const n = new URLSearchParams(location.search).get('n') || '1';
  const s = shots[n];
  const [fill, text] = states[s.state];
  const pill = document.getElementById('pill');
  pill.style.background = `color-mix(in srgb, ${fill} 18%, #FFFFFF)`;
  pill.style.color = text;
  pill.querySelector('i').style.background = fill;
  pill.querySelector('span').textContent = s.label;
  document.getElementById('title').innerHTML = s.title;
  document.getElementById('sub').textContent = s.sub;
  document.getElementById('shot').src = '../../screenshots/iphone/' + s.file;

  if (s.note) {
    // The alert's real texts: title "Codex needs your input", the Mac's name as subtitle, the session as body,
    // Soot waving as the thumbnail (iPhone/NotificationService/Artwork/alert-wave.png), and the long-press buttons.
    document.getElementById('extra').innerHTML = `
      <div class="note-stack">
        <div class="note">
          <img class="icon" src="../app-icon-1024.png" alt="">
          <div>
            <div class="row"><b>Codex needs your input</b><span class="now">now</span></div>
            <div class="subtitle">Studio</div>
            <div class="body">website · Needs permission to run npm install</div>
          </div>
          <img class="thumb" src="../../../iPhone/NotificationService/Artwork/alert-wave.png" alt="">
        </div>
        <div class="menu">
          <div>Keep awake 1h
            <svg viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h13v3a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6z"/><path d="M17 12h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8 3c-1 1.3 1 2 0 3.5M12 3c-1 1.3 1 2 0 3.5"/></svg></div>
          <div class="destructive">Sleep now
            <svg viewBox="0 0 24 24" fill="none" stroke="#B3261E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 15.5A8 8 0 0 1 8.5 5a8 8 0 1 0 8.5 10.5z"/><path d="M15 3h4l-4 4h4"/></svg></div>
        </div>
      </div>`;
  }
  if (s.soot) {
    document.getElementById('extra').innerHTML = `<img class="soot" src="../../../site/assets/mascot/${s.soot}" alt="">`;
  }
</script>
</body>
</html>
